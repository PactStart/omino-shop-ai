server:
  port: ${SERVER_PORT:8181}
  servlet:
    context-path: /api/app

spring:
  application:
    name: shop-api-app
  profiles:
    active: ${APP_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
