server:
  port: ${SERVER_PORT:8182}
  servlet:
    context-path: /api/admin
    session:
      cookie:
        name: sid_admin
        http-only: true
        same-site: lax

spring:
  application:
    name: shop-api-admin
  profiles:
    active: ${APP_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
