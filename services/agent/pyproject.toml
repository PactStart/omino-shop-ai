[project]
name = "omino-shop-agent"
version = "0.1.0"
requires-python = ">=3.12.8,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "httpx==0.28.1",
  "langgraph==1.2.20",
  "langchain-core==1.7.6",
  "langchain-openai==1.7.4",
  "langfuse==5.2.0",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.8",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
